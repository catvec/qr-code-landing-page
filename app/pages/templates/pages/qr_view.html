<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - {{ page.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-sm">
        <h1 class="text-xl font-semibold mb-4 text-gray-800">{{ page.name }}</h1>
        <div class="mb-4">
            {{ qr_svg|safe }}
        </div>
        <p class="text-sm text-gray-500 break-all mb-4">{{ full_url }}</p>
        <a href="{{ download_url }}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors">
            Download PNG
        </a>
    </div>
</body>
</html>
