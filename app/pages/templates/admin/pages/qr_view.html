{% extends "admin/pages/base_admin_page.html" %}

{% block title %}QR Code - {{ page.name }}{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'admin:pages_landingpage_change' page.pk %}" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300">
        ← Back to {{ page.name }}
    </a>
</div>

<div class="flex flex-col items-center justify-center py-8">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-sm">
        <h1 class="text-xl font-semibold mb-4" style="color: black;">{{ page.name }}</h1>
        <div class="mb-4 bg-white p-4 rounded">
            {{ qr_svg|safe }}
        </div>
        <p class="text-sm break-all mb-4" style="color: black;">{{ full_url }}</p>
        <a href="{{ download_url }}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors">
            Download PNG
        </a>
    </div>
</div>
{% endblock %}
