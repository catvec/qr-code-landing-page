apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: qr-landing-dev

images:
- name: ghcr.io/your-org/qr-landing
  newTag: latest

replicas:
- name: django
  count: 1

secretGenerator:
- name: postgres-secret
  envs:
  - postgres.env
- name: app-secret
  envs:
  - app.env

configMapGenerator:
- name: app-config
  envs:
  - app-config.env
