<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
     body {
         padding: 0;
         margin: 0;

         display: flex;
         align-items: center;
         justify-content: center;
         flex-direction: column;

         font-size: 10px;
         font-family: sans-serif;
     }

     #container {
         display: flex;
         width: 100%;
         max-width: 30rem;
         flex-direction: column;
         font-size: 2rem;
     }

     #container h1 {
         font-size: 3rem;
         margin: 0;
         margin-top: 1rem;
         margin-bottom: 1rem;
     }

     #container p {
         font-size: 1.5rem;
     }

     #container hr {
         width: 100%;
     }

     #container a {
         font-size: 1rem;
     }
    </style>
    <body>
        <div id="container">
            <h1>Create Link</h1>
            <p>
                Enter the values you want to have show up on the page, then copy the link below.
            </p>

            <hr />

            <label for="title-input">Title</label>
            <input
                id="title-input"
                type="text"
                placeholder="Title"
                oninput="buildLink()"
            />

            <label for="text-input">Text</label>
            <textarea
                id="text-input"
                placeholder="Text here"
                rows="8"
                oninput="buildLink()"
            ></textarea>

            <hr />

            <span>Link:</span>
            <a href="#" id="link"></a>
        </div>

        <script type="text/javascript">
         // Constants
         const TITLE_PARAM = "title"
         const TEXT_PARAM = "text";

         // Elements
         const linkEl = document.getElementById("link");
         const titleInputEl = document.getElementById("title-input");
         const textInputEl = document.getElementById("text-input");

         function buildLink() {
             const url = new URL("./", window.location.href);

             if (titleInputEl.value.length > 0) {
                 url.searchParams.set(TITLE_PARAM, titleInputEl.value);
             }

             if (textInputEl.value.length > 0) {
                 url.searchParams.set(TEXT_PARAM, textInputEl.value);
             }

             linkEl.href = url.toString();
             linkEl.innerText = url.toString();
             console.log("onchange", url.toString());
         }
         buildLink();
        </script>
    </body>
</html>
